# 本番（app VM）と手元で共通。手元では compose.override.yaml が自動で重なり、MySQL が足される
services:
  app:
    build: .
    image: auth:latest
    # VM の側のポートは、共通基盤の台帳で割り当てたもの（本番は deploy が .env に書く）
    ports:
      - "${APP_PORT:-8002}:3000"
    env_file:
      - path: .env
        required: false # 手元にはない
    environment:
      # 外から見た自分の origin。手元のコンテナでは compose.override.yaml が上書きする
      PUBLIC_ORIGIN: https://auth.alphajinsei.com
    restart: unless-stopped
